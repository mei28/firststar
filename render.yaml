services:
  # Backend API
  - type: web
    name: youtube-channel-finder-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: "uv sync"
    startCommand: "uv run uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: youtube-finder-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-finder-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://mei28.github.io"
      - key: QUOTA_DAILY_LIMIT
        value: "10000"
      - key: QUOTA_WARNING_THRESHOLD
        value: "2000"
      - key: API_HOST
        value: "0.0.0.0"
      - key: API_PORT
        value: "10000"

  # Redis Cache
  - type: redis
    name: youtube-finder-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# PostgreSQL Database
databases:
  - name: youtube-finder-db
    region: oregon
    plan: free
    databaseName: youtube_channels
    user: youtube_finder
